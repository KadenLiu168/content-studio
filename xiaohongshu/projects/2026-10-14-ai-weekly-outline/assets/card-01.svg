<text x="88" y="692" font-family="PingFang SC, sans-serif" font-size="42" font-weight="400" fill="#163d3b">材料 → 两个提纲 → 反馈 → 核查</text>
<text x="88" y="797" font-family="PingFang SC, sans-serif" font-size="34" font-weight="600" fill="#ad4527">使用边界</text>
