<text x="88" y="104" font-family="PingFang SC, sans-serif" font-size="30" font-weight="500" fill="#5c6f6b">01 / 06 · 提问方式</text>
<text x="88" y="198" font-family="PingFang SC, sans-serif" font-size="66" font-weight="600" fill="#163d3b">让 AI 写周报</text>
<text x="88" y="284" font-family="PingFang SC, sans-serif" font-size="66" font-weight="600" fill="#163d3b">先看提纲</text>
<text x="88" y="406" font-family="PingFang SC, sans-serif" font-size="34" font-weight="600" fill="#ad4527">先交材料，再讨论结构</text>
<text x="88" y="464" font-family="PingFang SC, sans-serif" font-size="42" font-weight="400" fill="#163d3b">给谁看？做了什么？</text>
<text x="88" y="529" font-family="PingFang SC, sans-serif" font-size="42" font-weight="400" fill="#163d3b">有哪些问题？下周做什么？</text>
