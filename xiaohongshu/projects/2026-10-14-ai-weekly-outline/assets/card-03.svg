<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-label="先要两个提纲
暂不写正文">
<rect width="1080" height="1440" fill="#f6f1e7"/>
<rect x="64" y="64" width="12" height="56" rx="6" fill="#ad4527"/>
<text x="88" y="104" font-family="PingFang SC, sans-serif" font-size="30" font-weight="500" fill="#5c6f6b">03 / 06 · 提问示范</text>
<text x="88" y="198" font-family="PingFang SC, sans-serif" font-size="66" font-weight="600" fill="#163d3b">先要两个提纲</text>
<text x="88" y="284" font-family="PingFang SC, sans-serif" font-size="66" font-weight="600" fill="#163d3b">暂不写正文</text>
<text x="88" y="406" font-family="PingFang SC, sans-serif" font-size="34" font-weight="600" fill="#ad4527">可这样提出要求</text>
<text x="88" y="464" font-family="PingFang SC, sans-serif" font-size="42" font-weight="400" fill="#163d3b">依据这组教学记录，列两个提纲：</text>
<text x="88" y="529" font-family="PingFang SC, sans-serif" font-size="42" font-weight="400" fill="#163d3b">A：进展、问题、下周计划</text>
<text x="88" y="594" font-family="PingFang SC, sans-serif" font-size="42" font-weight="400" fill="#163d3b">B：协调事项、已完成、下一步</text>
<text x="88" y="659" font-family="PingFang SC, sans-serif" font-size="42" font-weight="400" fill="#163d3b">每个要点注明对应哪条材料</text>
<text x="88" y="724" font-family="PingFang SC, sans-serif" font-size="42" font-weight="400" fill="#163d3b">缺信息就提出问题，不补事实</text>
<text x="88" y="829" font-family="PingFang SC, sans-serif" font-size="34" font-weight="600" fill="#ad4527">选择时看什么</text>
<text x="88" y="887" font-family="PingFang SC, sans-serif" font-size="42" font-weight="400" fill="#163d3b">这次汇报需要对方了解什么？</text>
<text x="88" y="952" font-family="PingFang SC, sans-serif" font-size="42" font-weight="400" fill="#163d3b">按用途选，不按辞藻选</text>
<path d="M88 1300 H992" stroke="#c5cdc5" stroke-width="2"/>
<text x="88" y="1348" font-family="PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#5c6f6b">进击的小皆 · AI 入门</text>
</svg>